name: Build check

# Проверка сборки на PR: тот же `astro build`, что и на деплое, но без публикации.
# Ловит поломки зависимостей и контента до попадания в main.
#
# Перед сборкой — `astro check`: `astro build` типы не проверяет, а структура
# данных в src/data/*.ts держится именно на типах (например, ограничение
# глубины вложенности листьев одним уровнем).
#
# Шаги зовут цели Makefile, а не bun напрямую: те же команды воспроизводятся
# локально один в один, и чинить упавшую проверку можно не читая workflow.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tools/**'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - 'Makefile'
      - '.github/workflows/build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

# Новый пуш в PR отменяет предыдущую проверку
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # make install при CI=true уходит в bun install --frozen-lockfile
      - name: Install dependencies
        run: make install

      - name: Typecheck
        run: make typecheck

      - name: Build
        run: make build

      # Стиль листьев: только детерминированные правила style-guide (§3.1–§3.8).
      # Оценка источников, примеры из практики, границы применимости и ритм
      # требуют человека и в CI не блокируют — см. tools/style/README.md.
      - name: Leaf style check
        run: make style-ci

name: Deploy site to GitHub Pages

# Триггеры:
# - push в main, затрагивающий Astro-проект или сам workflow
# - ручной запуск через UI (workflow_dispatch)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# Permissions для GitHub Pages OIDC deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Только один деплой за раз; новые отменяют ожидающие, но не in-progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

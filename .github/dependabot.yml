version: 2

# До перехода на bun обновления прилетали сами: Dependabot security updates
# работают без конфига и правили `package-lock.json`, включая транзитивные
# зависимости. Для bun security updates пока не поддерживаются — только version
# updates и только по конфигу, поэтому он здесь и появился.
# https://docs.github.com/en/code-security/reference/supply-chain-security/supported-ecosystems-and-repositories
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"
    open-pull-requests-limit: 5
    ignore:
      # js-yaml держится на 4.x намеренно: это не наша зависимость, а способ
      # зафиксировать, какая копия окажется в корневом node_modules. Astro
      # ждёт default-экспорт (js-yaml 4), markdownlint-cli2 требует ровно
      # 5.2.2 и получает свою вложенную копию. Мажорный бамп сломает билд.
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-major"]
      # typescript держится на 6.x, пока `astro check` не умеет работать с 7.
      # Нативный компилятор TypeScript 7 не отдаёт программный API, на котором
      # построен @astrojs/language-server, и цель typecheck падает целиком:
      # «The TypeScript module loaded (found 7.0.2) does not expose the
      # programmatic API that `astro check` relies on». Апстрим ведёт поддержку
      # в https://github.com/withastro/roadmap/discussions/1321 — как появится,
      # снять эти две строки.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(deps)"

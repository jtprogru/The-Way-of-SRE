version: "3"

tasks:
  default:
    desc: "Show available tasks"
    silent: true
    cmd: task --list

  install:
    desc: "Install dependencies"
    cmd: npm install
    sources:
      - package.json
    generates:
      - node_modules/.package-lock.json

  toc:
    desc: "Update Table of Contents in README and docs"
    deps: [install]
    cmd: npm run toc

  lint:
    desc: "Lint markdown files"
    deps: [install]
    cmd: npm run lint

  check:
    desc: "Run all checks (toc + lint)"
    deps: [toc, lint]

  site:install:
    desc: "Install site dependencies (Astro Starlight PoC)"
    dir: site
    cmd: npm install
    sources:
      - site/package.json
      - site/package-lock.json
    generates:
      - site/node_modules/.package-lock.json

  site:dev:
    desc: "Run site dev server at http://localhost:4321/The-Way-of-SRE/"
    deps: [site:install]
    dir: site
    cmd: npm run dev

  site:build:
    desc: "Build site to site/dist/"
    deps: [site:install]
    dir: site
    cmd: npm run build

  site:preview:
    desc: "Preview built site locally"
    deps: [site:build]
    dir: site
    cmd: npm run preview

version: "3"

tasks:
  default:
    desc: "Show available tasks"
    silent: true
    cmd: task --list

  install:
    desc: "Install dependencies"
    cmd: npm install
    sources:
      - package.json
    generates:
      - node_modules/.package-lock.json

  dev:
    desc: "Run site dev server at http://localhost:4321/The-Way-of-SRE/"
    deps: [install]
    cmd: npm run dev

  build:
    desc: "Build site to dist/"
    deps: [install]
    cmd: npm run build

  preview:
    desc: "Preview built site locally"
    deps: [build]
    cmd: npm run preview

  toc:
    desc: "Update Table of Contents in README and docs"
    deps: [install]
    cmd: npm run toc

  lint:
    desc: "Lint markdown files"
    deps: [install]
    cmd: npm run lint

  check:
    desc: "Run all checks (toc + lint)"
    deps: [toc, lint]
